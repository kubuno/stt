[module]
id            = "stt"
display_name  = "Speech-to-Text"
version       = "0.1.1"
description   = "Reconnaissance vocale auto-hébergée (Whisper) — alimente la recherche vocale du core"
author        = "Kubuno Contributors"
license       = "AGPL-3.0"
runtime       = "rust"
# Infrastructure interne (recherche vocale du core) : enregistré pour le routage,
# mais masqué de la liste des modules de l'administration.
internal      = true

[process]
entrypoint = "kubuno-stt"
args       = []

[server]
host = "127.0.0.1"
port = 3122

[routes]
patterns = [
    { method = "*", path = "/*" },
]
